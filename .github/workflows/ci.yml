name: CI Build & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build Application
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure Core Modules
        run: |
          if [ ! -f "src/services/walletDb.ts" ] || [ ! -f "src/types/wallet.ts" ] || [ ! -f "src/utils/formatters.ts" ]; then
            echo "Missing core modules detected. Restoring from base repository..."
            git clone --depth 1 https://github.com/alqadasif2-cloud/Wal99.git /tmp/walbase
            mkdir -p src/services src/types src/utils
            cp -r /tmp/walbase/src/services/* src/services/ 2>/dev/null || true
            cp -r /tmp/walbase/src/types/* src/types/ 2>/dev/null || true
            cp -r /tmp/walbase/src/utils/* src/utils/ 2>/dev/null || true
            echo "Core modules restored successfully."
          fi

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Run Type Check & Lint
        run: |
          npx tsc --noEmit
        continue-on-error: true

      - name: Build Production Assets
        run: |
          npx vite build --base=./
        env:
          NODE_ENV: production

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7
