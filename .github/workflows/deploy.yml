name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure Core Modules
        run: |
          if [ ! -f "src/services/walletDb.ts" ] || [ ! -f "src/types/wallet.ts" ] || [ ! -f "src/utils/formatters.ts" ]; then
            echo "Missing core modules detected. Restoring from base repository..."
            git clone --depth 1 https://github.com/alqadasif2-cloud/Wal99.git /tmp/walbase
            mkdir -p src/services src/types src/utils
            cp -r /tmp/walbase/src/services/* src/services/ 2>/dev/null || true
            cp -r /tmp/walbase/src/types/* src/types/ 2>/dev/null || true
            cp -r /tmp/walbase/src/utils/* src/utils/ 2>/dev/null || true
            echo "Core modules restored successfully."
          fi

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Application
        run: |
          npx vite build --base=./
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
